<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FRIDAY</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      // Let a Gemini tool request reuse the exact same Screen Vision action as
      // the visible Share Screen button, without changing the bundled UI code.
      (() => {
        // Keep the local Screen Vision capture and preview responsive. Gemini
        // Live currently accepts at most one image frame per second, so its
        // analysis stream is capped at 1 FPS even though capture runs at 10.
        const nativeGetDisplayMedia = navigator.mediaDevices?.getDisplayMedia
          ?.bind(navigator.mediaDevices);
        if (nativeGetDisplayMedia) {
          navigator.mediaDevices.getDisplayMedia = async (constraints = {}) => {
            const stream = await nativeGetDisplayMedia({
              ...constraints,
              video: {
                ...(constraints.video || {}),
                frameRate: { ideal: 10, max: 10 },
              },
            });
            if (stream) {
              if (window.friday && typeof window.friday.showScreenGlow === 'function') {
                window.friday.showScreenGlow('active');
              }
              if (typeof window.__setInAppScreenGlow === 'function') {
                window.__setInAppScreenGlow('active');
              }
              const vt = stream.getVideoTracks()[0];
              if (vt) {
                vt.addEventListener('ended', () => {
                  if (window.friday && typeof window.friday.hideScreenGlow === 'function') {
                    window.friday.hideScreenGlow();
                  }
                  if (typeof window.__setInAppScreenGlow === 'function') {
                    window.__setInAppScreenGlow('hide');
                  }
                });
              }
            }
            return stream;
          };
        }

        const nativeSetInterval = window.setInterval.bind(window);
        window.setInterval = (handler, timeout, ...args) => nativeSetInterval(
          handler,
          timeout <= 100 ? 1000 : (timeout === 2000 ? 1000 : timeout),
          ...args,
        );

        const NativeWebSocket = window.WebSocket;
        window.WebSocket = class FridayWebSocket extends NativeWebSocket {
          constructor(...args) {
            super(...args);
            this.addEventListener('message', (event) => {
              try {
                const parsed = JSON.parse(event.data);
                const messageType = parsed?.type;
                if (messageType === 'screen_glow') {
                  const action = parsed.action || 'active';
                  const duration = parsed.duration || 2600;
                  const label = parsed.label;
                  if (action === 'flash') {
                    window.friday?.flashScreenGlow?.(duration, { label });
                    window.__setInAppScreenGlow?.('flash', { duration, label });
                  } else if (action === 'hide' || action === 'inactive') {
                    window.friday?.hideScreenGlow?.();
                    window.__setInAppScreenGlow?.('hide');
                  } else if (action === 'paused') {
                    window.friday?.pauseScreenGlow?.();
                    window.__setInAppScreenGlow?.('paused');
                  } else {
                    window.friday?.showScreenGlow?.('active', { label });
                    window.__setInAppScreenGlow?.('active', { label });
                  }
                  return;
                }
                if (messageType === 'media_state') {
                  if (typeof window.__updateFridayNowPlaying === 'function') {
                    window.__updateFridayNowPlaying(parsed.data);
                  }
                  return;
                }
                if (messageType === 'index_status') {
                  if (typeof window.__updateFridayIndexStatus === 'function') {
                    window.__updateFridayIndexStatus(parsed.data);
                  }
                  return;
                }
                if (messageType === 'index_progress') {
                  if (typeof window.__updateFridayIndexProgress === 'function') {
                    window.__updateFridayIndexProgress(parsed.data);
                  }
                  return;
                }
                if (messageType === 'voice_output_mode') {
                  if (typeof window.__updateFridayVoiceMode === 'function') {
                    window.__updateFridayVoiceMode(parsed.mode);
                  }
                  return;
                }
                if (messageType === 'image_generated') {
                  if (typeof window.__showFridayGeneratedImage === 'function') {
                    window.__showFridayGeneratedImage(parsed.data);
                  }
                  return;
                }
                if (messageType === 'discord_status') {
                  if (typeof window.__updateFridayDiscordStatus === 'function') {
                    window.__updateFridayDiscordStatus(parsed.data);
                  }
                  return;
                }
                if (messageType === 'discord_activity') {
                  if (typeof window.__appendFridayDiscordActivity === 'function') {
                    window.__appendFridayDiscordActivity(parsed.data);
                  }
                  return;
                }
                if (messageType === 'discord_notify') {
                  if (typeof window.__showFridayDiscordToast === 'function') {
                    window.__showFridayDiscordToast(parsed.data);
                  }
                  return;
                }
                if (messageType === 'startScreenShare') {
                  window.friday?.showScreenGlow?.('active');
                  window.__setInAppScreenGlow?.('active');
                  const btn = [...document.querySelectorAll('button')].find((b) =>
                    b.title === 'Share Screen with Friday' || b.textContent?.includes('SHARE SCREEN')
                  );
                  btn?.click();
                  return;
                }
                if (messageType === 'stopScreenShare') {
                  window.friday?.hideScreenGlow?.();
                  window.__setInAppScreenGlow?.('hide');
                  const btn = [...document.querySelectorAll('button')].find((b) =>
                    b.title === 'Stop Sharing' || b.textContent?.includes('SHARING')
                  );
                  btn?.click();
                  return;
                }
                if (messageType === 'go_offline') {
                  console.log('[Friday] Received go_offline instruction. Pausing screen activities...');
                  window.friday?.hideScreenGlow?.();
                  window.__setInAppScreenGlow?.('hide');
                  // 1. Immediately pause/stop all background activities (e.g. screen sharing)
                  const stopShareBtn = [...document.querySelectorAll('button')].find((b) =>
                    b.title === 'Stop Sharing' || b.textContent?.includes('SHARING')
                  );
                  stopShareBtn?.click();

                  // 2. Wait for the final spoken response ("Going offline.") to finish playing, then minimize window to tray
                  setTimeout(() => {
                    console.log('[Friday] Audio complete. Window minimized to tray. Google voice listener active in background.');
                    if (window.friday && typeof window.friday.hideToTray === 'function') {
                      window.friday.hideToTray();
                    }
                  }, 1200);
                  return;
                }
                if (messageType === 'come_online') {
                  console.log('[Friday] Received come_online instruction. Restoring window to screen...');
                  if (window.friday && typeof window.friday.showWindow === 'function') {
                    window.friday.showWindow(false);
                  }
                  return;
                }
              } catch {
                // Ignore non-JSON WebSocket messages and unavailable UI state.
              }
            });
          }
        };
      })();
    </script>
    <script>
      // In-App Screen Glow Manager (for windowed mode or browser fallback)
      (() => {
        let inAppFlashTimer = null;
        window.__setInAppScreenGlow = (mode, options = {}) => {
          let el = document.getElementById('friday-inapp-screen-glow');
          if (!el) {
            el = document.createElement('div');
            el.id = 'friday-inapp-screen-glow';
            el.className = 'friday-inapp-screen-glow';
            el.innerHTML = '<div class="friday-inapp-glow-border"></div>';
            document.body.appendChild(el);
          }
          if (inAppFlashTimer) {
            clearTimeout(inAppFlashTimer);
            inAppFlashTimer = null;
          }
          el.classList.remove('is-active', 'is-flashing', 'is-paused');
          if (mode === 'hide' || mode === 'inactive' || !mode) {
            return;
          }
          if (mode === 'active' || mode === 'show') {
            el.classList.add('is-active');
          } else if (mode === 'paused') {
            el.classList.add('is-active', 'is-paused');
          } else if (mode === 'flash') {
            el.classList.add('is-active', 'is-flashing');
            const dur = options.duration || 2600;
            inAppFlashTimer = setTimeout(() => {
              el.classList.remove('is-active', 'is-flashing');
            }, dur);
          }
        };

        // Synchronize on direct UI button clicks (Pause, Resume, Stop Sharing, Sleep core)
        document.addEventListener('click', (e) => {
          try {
            const btn = e.target?.closest?.('button');
            if (!btn) return;
            const title = (btn.title || '').toLowerCase();
            const text = (btn.textContent || '').toLowerCase();
            if (title.includes('stop sharing') || text.includes('stop sharing') || text.includes('stop screen') || (text.includes('sharing') && !text.includes('share screen'))) {
              window.friday?.hideScreenGlow?.();
              window.__setInAppScreenGlow?.('hide');
            } else if (title.includes('pause stream') || text === 'pause') {
              window.friday?.pauseScreenGlow?.();
              window.__setInAppScreenGlow?.('paused');
            } else if (title.includes('resume stream') || text === 'resume') {
              window.friday?.showScreenGlow?.('active');
              window.__setInAppScreenGlow?.('active');
            } else if (title.includes('sleep core') || title === 'sleep' || text.includes('sleep')) {
              // When user turns off the mic / puts Friday core to sleep, immediately stop screen share
              console.log('[Friday] Mic turned off (Sleep core). Automatically turning off screen share...');
              try {
                if (typeof window.__fridayStopScreenShare === 'function') {
                  window.__fridayStopScreenShare();
                }
              } catch {}
              const stopBtn = [...document.querySelectorAll('button')].find((b) =>
                b.title === 'Stop Sharing' || b.textContent?.includes('SHARING')
              );
              stopBtn?.click();
              window.friday?.hideScreenGlow?.();
              window.__setInAppScreenGlow?.('hide');
            }
          } catch {}
        }, true);

        // Continuous State Watchdog: If core is in disconnected/off state, ensure screen sharing is off
        (() => {
          const checkCoreAndScreenShare = () => {
            try {
              const coreBtn = [...document.querySelectorAll('button')].find((b) =>
                b.title === 'Awake Friday' || b.title === 'Sleep core'
              );
              if (coreBtn && coreBtn.title === 'Awake Friday') {
                // Mic is off / disconnected
                const sharingBtn = [...document.querySelectorAll('button')].find((b) =>
                  b.title === 'Stop Sharing' || b.textContent?.includes('SHARING')
                );
                if (sharingBtn) {
                  console.log('[Friday Watchdog] Core mic is disconnected. Automatically stopping screen share...');
                  try {
                    if (typeof window.__fridayStopScreenShare === 'function') {
                      window.__fridayStopScreenShare();
                    }
                  } catch {}
                  sharingBtn.click();
                  window.friday?.hideScreenGlow?.();
                  window.__setInAppScreenGlow?.('hide');
                }
              }
            } catch {}
          };

          const observer = new MutationObserver(checkCoreAndScreenShare);
          if (document.body) {
            observer.observe(document.body, { childList: true, subtree: true, attributes: true, attributeFilter: ['title', 'class'] });
          } else {
            window.addEventListener('DOMContentLoaded', () => {
              observer.observe(document.body, { childList: true, subtree: true, attributes: true, attributeFilter: ['title', 'class'] });
            });
          }
        })();
      })();
    </script>
    <script>
      // Windows GSMTC / Spotify Native "Now Playing" HUD Component
      (() => {
        const formatTime = (ms) => {
          if (!ms || isNaN(ms)) return '0:00';
          const totalSec = Math.floor(ms / 1000);
          const min = Math.floor(totalSec / 60);
          const sec = totalSec % 60;
          return `${min}:${sec < 10 ? '0' : ''}${sec}`;
        };

        const initNowPlayingHUD = () => {
          if (document.getElementById('friday-now-playing-hud')) return;

          const hud = document.createElement('div');
          hud.id = 'friday-now-playing-hud';
          hud.className = 'friday-now-playing-hud';
          hud.innerHTML = `
            <div class="friday-np-liquid-glow"></div>
            <div class="friday-np-sheen"></div>
            <div class="friday-now-playing-header">
              <div class="friday-now-playing-badge" id="friday-np-badge">
                <span class="friday-now-playing-eq"><span></span><span></span><span></span><span></span></span>
                <span id="friday-np-source">SPOTIFY</span>
              </div>
              <div class="friday-np-status-pill">
                <span class="friday-np-live-dot"></span>
                <span id="friday-np-status">PLAYING</span>
              </div>
            </div>
            <div class="friday-now-playing-body">
              <div class="friday-now-playing-vinyl" id="friday-np-vinyl">
                <div class="friday-vinyl-grooves"></div>
                <div class="friday-vinyl-center" id="friday-np-icon">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.477 2 2 6.477 2 12s4.477 10 10 10 10-4.477 10-10S17.523 2 12 2zm4.586 14.424c-.18.295-.563.387-.857.207-2.35-1.435-5.308-1.76-8.793-.963-.335.077-.67-.133-.746-.468-.077-.334.132-.67.467-.746 3.808-.87 7.076-.496 9.722 1.115.294.18.386.562.207.855zm1.226-2.732c-.226.367-.707.482-1.074.256-2.69-1.653-6.79-2.133-9.97-1.168-.413.125-.85-.107-.975-.52-.125-.413.107-.85.52-.975 3.633-1.102 8.147-.568 11.243 1.333.367.226.482.707.256 1.074zm.106-2.846C14.692 8.95 9.375 8.775 6.297 9.71c-.494.15-1.018-.13-1.168-.624-.15-.494.13-1.018.624-1.168 3.532-1.072 9.404-.87 13.12 1.336.444.263.59.838.327 1.282-.264.444-.838.59-1.282.327z"/></svg>
                </div>
              </div>
              <div class="friday-now-playing-details">
                <div class="friday-now-playing-title" id="friday-np-title">No track playing</div>
                <div class="friday-now-playing-artist" id="friday-np-artist">Spotify Desktop</div>
              </div>
            </div>
            <div class="friday-now-playing-progress-wrap">
              <div class="friday-now-playing-bar">
                <div class="friday-now-playing-fill" id="friday-np-fill"></div>
              </div>
              <div class="friday-now-playing-times">
                <span id="friday-np-pos">0:00</span>
                <span id="friday-np-dur">0:00</span>
              </div>
            </div>
            <div class="friday-now-playing-controls">
              <button class="friday-media-btn" id="friday-media-prev" title="Previous Track">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="19" x2="5" y2="5"/></svg>
              </button>
              <button class="friday-media-btn btn-play-pause" id="friday-media-playpause" title="Play / Pause">
                <span id="friday-playpause-icon">
                  <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>
                </span>
              </button>
              <button class="friday-media-btn" id="friday-media-next" title="Next Track">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19"/></svg>
              </button>
            </div>
          `;

          document.body.appendChild(hud);

          const sendControl = (action) => {
            fetch('/api/media/control', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ action }),
            }).then(r => r.json()).then(data => {
              if (data && data.ok) window.__updateFridayNowPlaying(data);
            }).catch(() => {});
          };

          document.getElementById('friday-media-prev').onclick = () => sendControl('previous');
          document.getElementById('friday-media-playpause').onclick = () => sendControl('toggle');
          document.getElementById('friday-media-next').onclick = () => sendControl('next');
        };

        window.__updateFridayNowPlaying = (data) => {
          initNowPlayingHUD();
          const hud = document.getElementById('friday-now-playing-hud');
          if (!hud) return;

          if (!data || !data.ok || !data.title || data.playback_state === 'Closed' || data.playback_state === 'Stopped') {
            hud.classList.remove('is-visible');
            return;
          }

          hud.classList.add('is-visible');

          const isPaused = data.playback_state === 'Paused';
          const isSpotify = (data.source || '').toLowerCase().includes('spotify');

          hud.classList.toggle('is-paused', isPaused);

          const badge = document.getElementById('friday-np-badge');
          const sourceText = document.getElementById('friday-np-source');
          const statusText = document.getElementById('friday-np-status');
          const titleText = document.getElementById('friday-np-title');
          const artistText = document.getElementById('friday-np-artist');
          const fill = document.getElementById('friday-np-fill');
          const posText = document.getElementById('friday-np-pos');
          const durText = document.getElementById('friday-np-dur');
          const playPauseIcon = document.getElementById('friday-playpause-icon');

          if (badge) {
            badge.className = 'friday-now-playing-badge' + (isPaused ? ' is-paused' : (!isSpotify ? ' is-other' : ''));
          }
          if (sourceText) sourceText.textContent = (data.source || 'MEDIA').toUpperCase();
          if (statusText) statusText.textContent = data.playback_state || (isPaused ? 'PAUSED' : 'PLAYING');
          if (titleText) {
            titleText.textContent = data.title;
            titleText.title = data.title;
          }
          if (artistText) {
            artistText.textContent = data.artist || (data.album || data.source);
            artistText.title = artistText.textContent;
          }

          const pos = data.position_ms || 0;
          const dur = data.duration_ms || 0;
          const percent = dur > 0 ? Math.min(100, Math.max(0, (pos / dur) * 100)) : 0;

          if (fill) fill.style.width = `${percent}%`;
          if (posText) posText.textContent = formatTime(pos);
          if (durText) durText.textContent = formatTime(dur);

          if (playPauseIcon) {
            if (isPaused) {
              playPauseIcon.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>`;
            } else {
              playPauseIcon.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>`;
            }
          }
        };

        window.addEventListener('DOMContentLoaded', () => {
          initNowPlayingHUD();
          fetch('/api/media/now-playing')
            .then(r => r.json())
            .then(data => { if (data && data.ok) window.__updateFridayNowPlaying(data); })
            .catch(() => {});
        });
      })();
    </script>
    <script>
      // SoftAurora adapted from the supplied React Bits component.  This is a
      // native WebGL port because this packaged build has no editable React
      // source tree (or OGL dependency) to import from.
      (() => {
        const vertexShader = `
          attribute vec2 position;
          void main() { gl_Position = vec4(position, 0.0, 1.0); }
        `;
        const fragmentShader = `
          precision highp float;
          uniform float uTime; uniform vec3 uResolution; uniform float uSpeed;
          uniform float uScale; uniform float uBrightness; uniform vec3 uColor1;
          uniform vec3 uColor2; uniform float uNoiseFreq; uniform float uNoiseAmp;
          uniform float uBandHeight; uniform float uBandSpread; uniform float uOctaveDecay;
          uniform float uLayerOffset; uniform float uColorSpeed; uniform vec2 uMouse;
          uniform float uMouseInfluence; uniform bool uEnableMouse;
          #define TAU 6.28318
          vec3 gradientHash(vec3 p) {
            p=vec3(dot(p,vec3(127.1,311.7,234.6)),dot(p,vec3(269.5,183.3,198.3)),dot(p,vec3(169.5,283.3,156.9)));
            vec3 h=fract(sin(p)*43758.5453123); float phi=acos(2.0*h.x-1.0); float theta=TAU*h.y;
            return vec3(cos(theta)*sin(phi),sin(theta)*sin(phi),cos(phi));
          }
          float quinticSmooth(float t) { float t2=t*t; float t3=t*t2; return 6.0*t3*t2-15.0*t2*t2+10.0*t3; }
          vec3 cosineGradient(float t,vec3 a,vec3 b,vec3 c,vec3 d) { return a+b*cos(TAU*(c*t+d)); }
          float perlin3D(float amplitude,float frequency,float px,float py,float pz) {
            float x=px*frequency,y=py*frequency; float fx=floor(x),fy=floor(y),fz=floor(pz);
            float cx=ceil(x),cy=ceil(y),cz=ceil(pz);
            vec3 g000=gradientHash(vec3(fx,fy,fz)),g100=gradientHash(vec3(cx,fy,fz));
            vec3 g010=gradientHash(vec3(fx,cy,fz)),g110=gradientHash(vec3(cx,cy,fz));
            vec3 g001=gradientHash(vec3(fx,fy,cz)),g101=gradientHash(vec3(cx,fy,cz));
            vec3 g011=gradientHash(vec3(fx,cy,cz)),g111=gradientHash(vec3(cx,cy,cz));
            float d000=dot(g000,vec3(x-fx,y-fy,pz-fz)),d100=dot(g100,vec3(x-cx,y-fy,pz-fz));
            float d010=dot(g010,vec3(x-fx,y-cy,pz-fz)),d110=dot(g110,vec3(x-cx,y-cy,pz-fz));
            float d001=dot(g001,vec3(x-fx,y-fy,pz-cz)),d101=dot(g101,vec3(x-cx,y-fy,pz-cz));
            float d011=dot(g011,vec3(x-fx,y-cy,pz-cz)),d111=dot(g111,vec3(x-cx,y-cy,pz-cz));
            float sx=quinticSmooth(x-fx),sy=quinticSmooth(y-fy),sz=quinticSmooth(pz-fz);
            float lx00=mix(d000,d100,sx),lx10=mix(d010,d110,sx),lx01=mix(d001,d101,sx),lx11=mix(d011,d111,sx);
            return amplitude*mix(mix(lx00,lx10,sy),mix(lx01,lx11,sy),sz);
          }
          float auroraGlow(float t,vec2 shift) {
            vec2 uv=gl_FragCoord.xy/uResolution.y+shift; float noiseVal=0.0,freq=uNoiseFreq,amp=uNoiseAmp; vec2 samplePos=uv*uScale;
            for(float i=0.0;i<3.0;i+=1.0){noiseVal+=perlin3D(amp,freq,samplePos.x,samplePos.y,t);amp*=uOctaveDecay;freq*=2.0;}
            float yBand=uv.y*10.0-uBandHeight*10.0;
            return 0.3*max(exp(uBandSpread*(1.0-1.1*abs(noiseVal+yBand))),0.0);
          }
          void main() {
            vec2 uv=gl_FragCoord.xy/uResolution.xy; float t=uSpeed*0.4*uTime;
            vec2 shift=uEnableMouse?(uMouse-0.5)*uMouseInfluence:vec2(0.0); vec3 col=vec3(0.0);
            col+=0.99*auroraGlow(t,shift)*cosineGradient(uv.x+uTime*uSpeed*0.2*uColorSpeed,vec3(0.5),vec3(0.5),vec3(1.0),vec3(0.3,0.20,0.20))*uColor1;
            col+=0.99*auroraGlow(t+uLayerOffset,shift)*cosineGradient(uv.x+uTime*uSpeed*0.1*uColorSpeed,vec3(0.5),vec3(0.5),vec3(2.0,1.0,0.0),vec3(0.5,0.20,0.25))*uColor2;
            col*=uBrightness; gl_FragColor=vec4(col,clamp(length(col),0.0,1.0));
          }
        `;

        const compile = (gl, type, source) => {
          const shader = gl.createShader(type);
          gl.shaderSource(shader, source); gl.compileShader(shader);
          if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(shader));
          return shader;
        };
        const hexToVec3 = (hex) => [0, 2, 4].map((offset) => parseInt(hex.slice(1 + offset, 3 + offset), 16) / 255);

        const startSoftAurora = () => {
          const desktop = document.getElementById('friday-desktop');
          if (!desktop || window.__fridaySoftAurora) return Boolean(desktop);
          try {
            const container = document.createElement('div');
            container.className = 'soft-aurora-container';
            const canvas = document.createElement('canvas');
            container.appendChild(canvas);
            desktop.insertBefore(container, desktop.firstChild);
            // A dedicated speech-only layer sits above the aurora. It never

        window.__fridayVoiceMode = 'NORMAL';

        const updateVoiceBadgeUI = (mode) => {
          const normalized = (String(mode || '').toUpperCase() === 'SILENT') ? 'SILENT' : 'NORMAL';
          window.__fridayVoiceMode = normalized;
          const btn = document.getElementById('friday-header-voice-btn');
          if (!btn) return;

          if (normalized === 'SILENT') {
            btn.className = 'friday-header-voice-btn is-silent';
            btn.title = 'Voice Output: Silent Mode (Spoken voice suppressed; listening, reasoning, and tools active) • Click or press Ctrl+Shift+M to unmute';
            btn.innerHTML = `
              <span class="friday-voice-dot"></span>
              <span>SILENT MODE</span>
              <kbd>Ctrl+Shift+M</kbd>
            `;
          } else {
            btn.className = 'friday-header-voice-btn is-normal';
            btn.title = 'Voice Output: Normal (Spoken voice active) • Click or press Ctrl+Shift+M to activate Silent Mode';
            btn.innerHTML = `
              <span class="friday-voice-dot"></span>
              <span>VOICE ON</span>
              <kbd>Ctrl+Shift+M</kbd>
            `;
          }
        };

        window.__updateFridayVoiceMode = updateVoiceBadgeUI;

        const toggleVoiceMode = async () => {
          const nextMode = (window.__fridayVoiceMode === 'SILENT') ? 'NORMAL' : 'SILENT';
          try {
            const res = await fetch('/api/voice/mode', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ mode: nextMode })
            });
            const data = await res.json();
            if (data && data.ok) {
              updateVoiceBadgeUI(data.mode);
            }
          } catch (err) {
            console.error('[Voice Mode Toggle Error]:', err);
          }
        };

        window.__fridayToggleVoiceMode = toggleVoiceMode;

        // Global Keyboard Shortcut: Ctrl+Shift+M (or Cmd+Shift+M)
        window.addEventListener('keydown', (e) => {
          if ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === 'm' || e.key === 'M')) {
            e.preventDefault();
            toggleVoiceMode();
          }
        });

        // Header Voice Mode Button Injection
        const attachHeaderVoiceTrigger = () => {
          const header = document.querySelector('#friday-desktop > header > div:last-child');
          if (!header || document.getElementById('friday-header-voice-btn')) return;

          const btn = document.createElement('button');
          btn.id = 'friday-header-voice-btn';
          btn.className = `friday-header-voice-btn is-${window.__fridayVoiceMode.toLowerCase()}`;
          btn.onclick = () => toggleVoiceMode();
          
          const searchBtn = document.getElementById('friday-header-search-btn');
          if (searchBtn && searchBtn.parentNode === header) {
            header.insertBefore(btn, searchBtn);
          } else {
            header.insertBefore(btn, header.firstChild);
          }
          updateVoiceBadgeUI(window.__fridayVoiceMode);
        };

        const fetchVoiceMode = async () => {
          try {
            const res = await fetch('/api/voice/mode');
            const data = await res.json();
            if (data && data.ok) {
              updateVoiceBadgeUI(data.mode);
            }
          } catch {}
        };

        window.addEventListener('DOMContentLoaded', () => {
          attachHeaderVoiceTrigger();
          fetchVoiceMode();
          const obs = new MutationObserver(attachHeaderVoiceTrigger);
          obs.observe(document.body, { childList: true, subtree: true });
        });
      })();
    </script>

    <script>

              inset: 0;

        const initImageHUD = () => {

          const previewBox = document.getElementById('friday-image-preview-box');

            previewBox.onclick = () => {

              const lbImg = document.getElementById('friday-lightbox-img');

          if (lbClose) lbClose.onclick = () => lightbox.classList.remove('is-open');

          lightbox.onclick = (e) => {
            if (e.target === lightbox) lightbox.classList.remove('is-open');

          window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && lightbox.classList.contains('is-open')) {
              lightbox.classList.remove('is-open');

          // Action: Open in Windows default photo viewer
          const openBtn = document.getElementById('friday-image-open-btn');
          if (openBtn) {
            openBtn.onclick = () => {
              if (!currentImageData) return;
              fetch('/api/images/open', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ filePath: currentImageData.filePath, fileName: currentImageData.fileName })
              }).catch(() => {});
            };
          }

          // Action: Reveal in File Explorer
          const folderBtn = document.getElementById('friday-image-folder-btn');
          if (folderBtn) {
            folderBtn.onclick = () => {
              if (!currentImageData) return;
              fetch('/api/images/open-folder', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ filePath: currentImageData.filePath, fileName: currentImageData.fileName })
              }).catch(() => {});
            };
          }

          // Pause auto-dismiss timer on hover
          hud.onmouseenter = () => {
            if (autoDismissTimer) clearTimeout(autoDismissTimer);
          };
        };

        window.__showFridayGeneratedImage = (data) => {
          if (!data || !data.url) return;
          initImageHUD();
          currentImageData = data;

          const hud = document.getElementById('friday-image-hud');
          const thumb = document.getElementById('friday-image-thumb');
          const promptText = document.getElementById('friday-image-prompt-text');
          const modelTag = document.getElementById('friday-image-model-tag');

          if (thumb) thumb.src = data.url;
          if (promptText) promptText.textContent = data.prompt || 'Generated AI Artwork';
          if (modelTag) {
            const m = (data.model || 'IMAGEN 3').toUpperCase();
            modelTag.textContent = m.includes('IMAGEN') ? 'IMAGEN 3' : (m.includes('FLUX') ? 'FLUX.1' : 'AI ART');
          }

          if (hud) {
            hud.classList.add('is-visible');

            // Auto dismiss after 20 seconds unless hovered
            if (autoDismissTimer) clearTimeout(autoDismissTimer);
            autoDismissTimer = setTimeout(() => {
              hud.classList.remove('is-visible');
            }, 20000);
          }
        };

        window.addEventListener('DOMContentLoaded', () => {
          initImageHUD();
        });
      })();
    </script>

    <!-- FRIDAY Auto-Open Mic & Live Voice on Application Startup -->
    <script>
      (() => {
        let hasTriggered = false;

        const isAutoStartMicEnabled = () => {
          try {
            const raw = window.localStorage.getItem('friday.settings.v2');
            if (!raw) return true;
            const parsed = JSON.parse(raw);
            return parsed.autoStartMic !== false;
          } catch {
            return true;
          }
        };

        const attemptAutoStart = () => {
          if (hasTriggered || window.__fridayMicAutoStarted) return true;
          if (!isAutoStartMicEnabled()) {
            hasTriggered = true;
            window.__fridayMicAutoStarted = true;
            return true;
          }

          // STRICT check: ONLY find the button with title === "Awake Friday"
          const wakeButton = [...document.querySelectorAll('button')]
            .find((b) => b.title === 'Awake Friday');

          if (wakeButton) {
            hasTriggered = true;
            window.__fridayMicAutoStarted = true;
            console.log('[Friday AutoStart] Awakening Friday and activating microphone stream...');

            // Wait 500ms for backend WebSocket upgrade listener & Audio context readiness
            setTimeout(() => {
              try {
                // Re-verify the button is still in "Awake Friday" (disconnected) state before clicking
                const currentBtn = [...document.querySelectorAll('button')]
                  .find((b) => b.title === 'Awake Friday');
                if (currentBtn) {
                  currentBtn.click();
                  console.log('[Friday AutoStart] Voice session auto-connected successfully.');
                }
              } catch (err) {
                console.error('[Friday AutoStart] Activation click error:', err);
              }
            }, 500);
            return true;
          }
          return false;
        };

        const startObserver = () => {
          if (attemptAutoStart()) return;

          const observer = new MutationObserver(() => {
            if (attemptAutoStart()) {
              observer.disconnect();
            }
          });

          observer.observe(document.body, { childList: true, subtree: true });

          const timer = setInterval(() => {
            if (attemptAutoStart()) {
              clearInterval(timer);
              observer.disconnect();
            }
          }, 300);

          setTimeout(() => {
            clearInterval(timer);
            observer.disconnect();
          }, 20000);
        };

        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', startObserver, { once: true });
        } else {
          startObserver();
        }
      })();
    </script>
