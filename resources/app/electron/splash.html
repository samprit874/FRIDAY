<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FRIDAY</title>
    <style>
      :root { color-scheme: dark; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; background: transparent; overflow: hidden; }
      .card {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        border-radius: 24px;
        background: radial-gradient(120% 120% at 50% 0%, #16161f 0%, #0a0a0f 70%);
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.65);
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      }
      .logo-img {
        width: 150px;
        height: auto;
        border-radius: 16px;
        filter: drop-shadow(0 0 18px rgba(96, 165, 250, 0.4));
      }
      .ring {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        border: 3px solid rgba(255, 255, 255, 0.10);
        border-top-color: #60a5fa;
        animation: spin 0.85s linear infinite;
      }
      .status { font-size: 12px; color: rgba(255, 255, 255, 0.55); letter-spacing: 0.08em; text-transform: uppercase; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div class="card">
      <img class="logo-img" src="../assets/Applogo.png" alt="FRIDAY" />
      <div class="ring"></div>
      <div class="status">Starting Core Systems…</div>
    </div>
    <script>document.querySelector('.card').style.cssText += '-webkit-app-region: drag';</script>
  </body>
</html>
